; Alembic config for the AI QA Portal.
;
; Run from the repo root with the package on sys.path:
;   uv run alembic -c ai_qa_portal/alembic.ini upgrade head
; or:
;   python -m alembic -c ai_qa_portal/alembic.ini upgrade head
;
; The DB URL is read at runtime from ai_qa_portal.backend.config.settings
; (i.e. from ``DATABASE_URL`` env / .env), so we leave ``sqlalchemy.url``
; blank here. The env.py wires it up.

[alembic]
script_location = ai_qa_portal/backend/alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
